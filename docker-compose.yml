services:
  db:
    image: postgres:16-alpine
    container_name: ordinace_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ordinace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ordinace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ordinace_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/ordinace_db
      SECRET_KEY: dev_secret_key_ppro_ordinace_na_vyhlidce_change_in_production
    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data:
